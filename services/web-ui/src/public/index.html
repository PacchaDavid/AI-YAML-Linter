<head>

  <title>YAML Linter — Análisis de configuración</title>

  <!-- Variable Font: Geist (developer-grade, Technical Mono aesthetic) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- CodeMirror 6 via esm.sh CDN

  <!-- CodeMirror 6 via esm.sh CDN with ?external= on ALL non-leaf packages.
       This ensures every shared dependency (@codemirror/state, @lezer/common, etc.)
       is loaded ONCE via the importmap, not bundled inside each package. -->

      "@codemirror/language": "https://esm.sh/@codemirror/language@6.10.3?external=@codemirror/state,@codemirror/view,@lezer/common,@lezer/lr,@lezer/highlight,style-mod",
      "@codemirror/commands": "https://esm.sh/@codemirror/commands@6.6.2?external=@codemirror/state,@codemirror/view",
      "@codemirror/autocomplete": "https://esm.sh/@codemirror/autocomplete@6.17.0?external=@codemirror/state,@codemirror/view,@codemirror/language,style-mod",
      "@codemirror/search": "https://esm.sh/@codemirror/search@6.5.6?external=@codemirror/state,@codemirror/view,@codemirror/language",

      "@lezer/highlight": "https://esm.sh/@lezer/highlight@1.2.1?external=@lezer/common",
      "@lezer/yaml": "https://esm.sh/@lezer/yaml@1.0.2?external=@lezer/common,@lezer/lr",

  <style>
    /* ═══════════════════════════════════════════
       STEP 0 — OKLCH Design Token System (2026)
       Technical Mono — Dev Tool Aesthetic
       ═══════════════════════════════════════════ */
    :root {
      /* ── COLORS (OKLCH) ── */
      --bg:           oklch(6% 0.015 260);    /* deeper canvas — terminal black */
      --surface:      oklch(10% 0.015 260);   /* cards, panels */
      --surface-up:   oklch(14% 0.015 260);   /* hover elevated */
      --surface-hover: oklch(17% 0.015 260);
      --fg:           oklch(94% 0.01 95);     /* primary text — warm white */
      --fg-muted:     oklch(60% 0.01 260);    /* secondary text */
      --fg-dim:       oklch(40% 0.01 260);    /* disabled/placeholder */

      /* Dev Tool accent — terminal green lineage */
      --primary:      oklch(65% 0.18 145);    /* vivid terminal green */
      --primary-up:   oklch(72% 0.18 145);    /* hover */
      --primary-glow: oklch(65% 0.18 145 / 0.35);
      --primary-dim:  oklch(35% 0.10 145);    /* subtle green background */

      --ok:           oklch(65% 0.18 145);    /* success green */
      --ok-glow:      oklch(65% 0.18 145 / 0.25);
      --ok-dim:       oklch(65% 0.18 145 / 0.08);
      --warn:         oklch(78% 0.17 75);     /* warning amber */
      --warn-glow:    oklch(78% 0.17 75 / 0.25);
      --err:          oklch(60% 0.22 25);     /* error red */
      --err-glow:     oklch(60% 0.22 25 / 0.25);
      --err-dim:      oklch(60% 0.22 25 / 0.08);

      /* Semantic stage colors */
      --stage-lex:    var(--err);
      --stage-syn:    var(--warn);
      --stage-sem:    oklch(62% 0.18 265);    /* blue for semantic */

      --border:       oklch(20% 0.015 260);
      --border-faint: oklch(14% 0.01 260);
      --border-accent: oklch(65% 0.18 145 / 0.25); /* green-tinted border */

      /* ── TYPOGRAPHY (Technical Mono) ── */
      --font:         'Inter', system-ui, -apple-system, sans-serif;
      --font-display: 'Inter', system-ui, sans-serif;
      --font-mono:    'JetBrains Mono', 'Fira Code', monospace;

      /* ── RADIUS (sharper — code brutalism influence) ── */
      --r-xs:   0.125rem;
      --r-sm:   0.25rem;
      --r:      0.5rem;
      --r-lg:   0.75rem;
      --r-xl:   1rem;
      --r-full: 9999px;

      /* ── MOTION ── */
      --ease-out:    cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-expo:   cubic-bezier(0.16, 1, 0.3, 1);
      --dur-fast:  120ms;
      --dur-base:  200ms;
      --dur-slow:  400ms;
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── Grain Texture Overlay (Technical Mono warmth) ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px 256px;
    }

    /* ── Scan Line Effect (terminal CRT vibe) ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 9998;
      pointer-events: none;
      opacity: 0.015;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        oklch(100% 0 0 / 0.3) 2px,
        oklch(100% 0 0 / 0.3) 3px
      );
    }

    /* ── Liquid Glass Utility ── */
    .lg {
      background: linear-gradient(
        135deg,
        oklch(100% 0 0 / 0.06) 0%,
        oklch(100% 0 0 / 0.015) 100%
      );
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      border: 1px solid oklch(100% 0 0 / 0.08);
      box-shadow:
        inset 0 1px 0 oklch(100% 0 0 / 0.08),
        0 4px 24px oklch(0% 0 0 / 0.4);
      border-radius: var(--r);
    }
    .lg-hover:hover {
      border-color: var(--border-accent);
      box-shadow:
        inset 0 1px 0 oklch(100% 0 0 / 0.12),
        0 8px 32px oklch(0% 0 0 / 0.5);
      transition: all var(--dur-base) var(--ease-out);
    }

    /* ── Terminal border variant (brutalist edge) ── */
    .lg-terminal {
      border-left: 2px solid var(--primary-dim);
      border-top: 1px solid oklch(100% 0 0 / 0.06);
      border-right: 1px solid oklch(100% 0 0 / 0.06);
      border-bottom: 1px solid oklch(100% 0 0 / 0.06);
    }

    /* ── Reading Progress Bar (scroll-driven) ── */
    .progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 200;
      height: 2px;
      background: linear-gradient(90deg, var(--primary), oklch(65% 0.18 145 / 0.4));
      animation: grow-width linear forwards;
      animation-timeline: scroll(root block);
      animation-range: 0% 100%;
      transform-origin: left;
    }
    @keyframes grow-width {
      from { width: 0%; }
      to   { width: 100%; }
    }

    /* ── Navbar ── */
    .navbar {
      position: fixed;
      top: 2px; left: 0; right: 0;
      z-index: 100;
      padding: 0.65rem 1.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 0;
      border-bottom: 1px solid oklch(100% 0 0 / 0.06);
      border-top: none;
      /* @starting-style for enter animation */
      opacity: 1;
      transform: translateY(0);
      transition: opacity var(--dur-slow) var(--ease-out),
                  transform var(--dur-slow) var(--ease-expo);
    }
    @starting-style {
      .navbar {
        opacity: 0;
        transform: translateY(-12px);
      }
    }
    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .navbar-brand .icon {
      font-size: 1.2rem;
      filter: drop-shadow(0 0 4px var(--primary-glow));
    }
    .navbar-badge {
      font-size: 0.6rem;
      padding: 0.15rem 0.5rem;
      border-radius: var(--r-full);
      background: var(--primary-dim);
      color: var(--primary);
      font-weight: 600;
      font-family: var(--font-mono);
      letter-spacing: 0.04em;
      border: 1px solid var(--border-accent);
    }
    .navbar-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.8rem;
      font-family: var(--font-mono);
      color: var(--fg-muted);
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .status-dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 6px var(--ok-glow);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }
    .status-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* ── Layout ── */
    .main-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      padding: 5rem 1.5rem 1.5rem;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    /* ── Panel Base ── */
    .panel {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1rem;
      border-radius: var(--r) var(--r) 0 0;
      border-bottom: 1px solid oklch(100% 0 0 / 0.05);
    }
    .panel-title {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--fg-muted);
    }
    .panel-title .dot {
      color: var(--primary);
      font-size: 0.65rem;
    }
    .panel-actions {
      display: flex;
      gap: 0.4rem;
      align-items: center;
    }
    .file-info {
      font-size: 0.7rem;
      color: var(--fg-dim);
      font-family: var(--font-mono);
      padding: 0.2rem 0.45rem;
      background: oklch(100% 0 0 / 0.04);
      border-radius: var(--r-xs);
      border: 1px solid var(--border-faint);
    }

    /* ── Editor Wrapper (CodeMirror overrides) ── */
    /* ── Drag-and-Drop Upload Overlay ── */
    .drop-zone {
      position: relative;
    }
    .drop-overlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 50;
      background: oklch(6% 0.015 260 / 0.85);
      border: 2px dashed var(--primary);
      border-radius: var(--r);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 0.75rem;
      animation: fade-in var(--dur-base) var(--ease-out) both;
    }
    .drop-overlay.visible {
      display: flex;
    }
    .drop-overlay .icon {
      font-size: 2.5rem;
      filter: drop-shadow(0 0 8px var(--primary-glow));
    }
    .drop-overlay h3 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--primary);
      font-family: var(--font-mono);
    }
    .drop-overlay p {
      font-size: 0.75rem;
      color: var(--fg-muted);
      font-family: var(--font-mono);
    }

    .editor-wrapper {
      flex: 1;
      border-radius: 0 0 var(--r) var(--r);
      overflow: hidden;
      min-height: 400px;
    }
    .editor-wrapper .cm-editor {
      height: 100%;
      min-height: 400px;
      font-size: 13.5px;
      background: var(--bg);
    }
    .editor-wrapper .cm-scroller {
      font-family: var(--font-mono);
      padding: 0.75rem 0;
    }
    .editor-wrapper .cm-content {
      caret-color: var(--primary);
    }
    .editor-wrapper .cm-gutters {
      background: var(--bg) !important;
      border-right: 1px solid oklch(100% 0 0 / 0.05) !important;
    }
    .editor-wrapper .cm-activeLineGutter {
      background: var(--primary-dim) !important;
    }
    .editor-wrapper .cm-activeLine {
      background: oklch(100% 0 0 / 0.025) !important;
    }
    .editor-wrapper .cm-cursor {
      border-left-color: var(--primary) !important;
      border-left-width: 2px;
    }
    .editor-wrapper .cm-selectionBackground {
      background: oklch(65% 0.18 145 / 0.2) !important;
    }

    /* ── Buttons (brutalist-edged) ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: var(--r-sm);
      font-family: var(--font);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--dur-fast) var(--ease-out);
      letter-spacing: -0.01em;
    }
    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none !important;
    }
    .btn-primary {
      background: var(--primary);
      color: oklch(8% 0.015 260);
      box-shadow: 0 0 16px var(--primary-glow);
      border: 1px solid transparent;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--primary-up);
      box-shadow: 0 0 24px var(--primary-glow);
      transform: translateY(-1px);
    }
    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }
    .btn-ghost {
      background: transparent;
      color: var(--fg-muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover:not(:disabled) {
      background: var(--surface-up);
      color: var(--fg);
      border-color: var(--border-accent);
    }

    /* ── Utility: fade-in keyframe (reusable) ── */
    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .fade-in {
      animation: fade-in var(--dur-slow) var(--ease-out) both;
    }

    /* ── States (Empty / Loading / Error) ── */
    .state-empty, .state-loading, .state-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 2rem;
      gap: 0.75rem;
      min-height: 400px;
      border-radius: var(--r);
    }
    .state-empty .icon {
      font-size: 2.5rem;
      opacity: 0.2;
      filter: grayscale(1);
    }
    .state-empty h3 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--fg-muted);
      font-family: var(--font-mono);
    }
    .state-empty p {
      font-size: 0.8rem;
      color: var(--fg-dim);
      max-width: 280px;
      line-height: 1.5;
    }

    /* ── Skeleton Loader (replaces spinner — "never spinners") ── */
    .state-loading {
      gap: 1.25rem;
      padding: 2rem 2rem;
    }
    .skeleton-group {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .skeleton {
      background: linear-gradient(
        90deg,
        var(--surface-up) 25%,
        oklch(20% 0.015 260) 50%,
        var(--surface-up) 75%
      );
      background-size: 200% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
      border-radius: var(--r-xs);
    }
    .skeleton-line {
      height: 12px;
      width: 100%;
    }
    .skeleton-line:first-child { width: 70%; }
    .skeleton-line:nth-child(2) { width: 85%; }
    .skeleton-line:nth-child(3) { width: 55%; }
    .skeleton-line:nth-child(4) { width: 40%; }
    .skeleton-block {
      height: 80px;
      width: 100%;
      margin-top: 0.25rem;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .state-loading .loading-label {
      font-size: 0.8rem;
      color: var(--fg-dim);
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .state-loading .loading-label .cursor-blink {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: var(--primary);
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* ── Results ── */
    .results-content {
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .result-summary {
      padding: 0.85rem 1rem;
      border-radius: var(--r);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      opacity: 1;
      transform: scale(1);
      transition: opacity var(--dur-base) var(--ease-out),
                  transform var(--dur-base) var(--ease-spring);
    }
    @starting-style {
      .result-summary {
        opacity: 0;
        transform: scale(0.96);
      }
    }
    .result-summary.valid {
      background: var(--ok-dim);
      border: 1px solid oklch(65% 0.18 145 / 0.2);
      border-left: 3px solid var(--ok);
    }
    .result-summary.invalid {
      background: var(--err-dim);
      border: 1px solid oklch(60% 0.22 25 / 0.2);
      border-left: 3px solid var(--err);
    }
    .result-summary .icon-lg { font-size: 1.3rem; }
    .result-summary .info h4 {
      font-size: 0.85rem;
      font-weight: 700;
      font-family: var(--font-mono);
    }
    .result-summary .info p {
      font-size: 0.75rem;
      color: var(--fg-muted);
      margin-top: 0.1rem;
    }

    /* ── Error Cards (terminal block style) ── */
    .error-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      overflow-y: auto;
      max-height: 560px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .error-card {
      padding: 0.85rem 1rem;
      border-radius: var(--r);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border);
      background: linear-gradient(
        135deg,
        oklch(100% 0 0 / 0.04) 0%,
        oklch(100% 0 0 / 0.01) 100%
      );
      animation: slide-in var(--dur-base) var(--ease-out) both;
      position: relative;
      overflow: hidden;
    }
    /* Terminal scan-line subtle overlay on cards */
    .error-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        oklch(100% 0 0 / 0.015) 2px,
        oklch(100% 0 0 / 0.015) 3px
      );
      pointer-events: none;
      opacity: 0.5;
    }

    .error-card[data-stage="lexical"] {
      border-left-color: var(--stage-lex);
      border-color: oklch(60% 0.22 25 / 0.15);
    }
    .error-card[data-stage="syntactic"] {
      border-left-color: var(--stage-syn);
      border-color: oklch(78% 0.17 75 / 0.15);
    }
    .error-card[data-stage="semantic"] {
      border-left-color: var(--stage-sem);
      border-color: oklch(62% 0.18 265 / 0.15);
    }

    .error-card:hover {
      border-color: var(--border-accent);
      background: linear-gradient(
        135deg,
        oklch(100% 0 0 / 0.06) 0%,
        oklch(100% 0 0 / 0.02) 100%
      );
      transition: all var(--dur-base) var(--ease-out);
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateX(-12px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .error-card .card-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }
    .error-card .stage-badge {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.15rem 0.45rem;
      border-radius: var(--r-xs);
      font-family: var(--font-mono);
    }
    .error-card[data-stage="lexical"] .stage-badge {
      background: oklch(60% 0.22 25 / 0.12);
      color: var(--err);
    }
    .error-card[data-stage="syntactic"] .stage-badge {
      background: oklch(78% 0.17 75 / 0.12);
      color: var(--warn);
    }
    .error-card[data-stage="semantic"] .stage-badge {
      background: oklch(62% 0.18 265 / 0.12);
      color: oklch(62% 0.18 265);
    }

    .error-card .error-code {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--fg-muted);
      font-weight: 600;
    }
    .error-card .error-location {
      font-size: 0.7rem;
      color: var(--fg-dim);
      margin-left: auto;
      font-family: var(--font-mono);
    }
    .error-card .error-message {
      font-size: 0.8rem;
      color: var(--fg);
      margin-bottom: 0.4rem;
      line-height: 1.4;
      position: relative;
      z-index: 1;
    }
    .error-card .error-explanation {
      font-size: 0.75rem;
      color: var(--ok);
      padding: 0.5rem 0.65rem;
      background: var(--ok-dim);
      border-radius: var(--r-xs);
      border: 1px solid oklch(65% 0.18 145 / 0.12);
      position: relative;
      z-index: 1;
      line-height: 1.4;
    }
    .error-card .error-explanation::before {
      content: '>';
      color: var(--ok);
      font-family: var(--font-mono);
      font-weight: 700;
      margin-right: 0.4rem;
    }

    /* ── Scrollbar Styling ── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: var(--r-full);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--fg-dim);
    }


    /* ── Keyboard Shortcut Hint ── */
    .kbd-hint {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      font-size: 0.65rem;
      color: var(--fg-dim);
      font-family: var(--font-mono);
    }
    .kbd-hint kbd {
      padding: 0.1rem 0.3rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-xs);
      font-size: 0.6rem;
      font-family: var(--font-mono);
      line-height: 1;
    }

    /* ── Connection error state ── */
    .connection-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem;
      text-align: center;
    }
    .connection-error .retry-btn {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--border-accent);
      padding: 0.4rem 1rem;
      border-radius: var(--r-sm);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      cursor: pointer;
      transition: all var(--dur-fast) var(--ease-out);
    }
    .connection-error .retry-btn:hover {
      background: var(--primary-dim);
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .main-container {
        grid-template-columns: 1fr;
        padding: 4.5rem 0.75rem 0.75rem;
        gap: 0.75rem;
      }
      .error-list { max-height: none; }
      .navbar { padding: 0.5rem 1rem; }
      .navbar-brand { font-size: 0.9rem; }
      .navbar-actions .status-label { display: none; }
      .kbd-hint { display: none; }
    }

    /* ── Reduced Motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .skeleton { animation: none !important; background: var(--surface-up); }
      .error-card { animation: none !important; }
      .navbar { opacity: 1 !important; transform: none !important; }
      .result-summary { opacity: 1 !important; transform: none !important; }
      .progress-bar { display: none; }
    }
  </style>
</head>
<body>
  <!-- Scroll-Driven Reading Progress Bar -->
  <div class="progress-bar"></div>

  <!-- Navbar -->
  <nav class="navbar lg">
    <div class="navbar-brand">
      <span class="icon">🧪</span>
      YAML Linter
      <span class="navbar-badge">v1.0</span>
    </div>
    <div class="navbar-actions">
      <span class="status-indicator">
        <span class="status-dot"></span>
        <span class="status-label">En línea</span>
      </span>
    </div>
  </nav>

  <!-- Main Grid -->
  <div class="main-container">
    <!-- Editor Column -->
    <div class="panel editor-panel">
      <div class="panel-header lg lg-terminal">
        <div class="panel-title">
          <span class="dot">▶</span>
          Editor
        </div>
        <div class="panel-actions">
          <span class="file-info" id="fileInfo">0 caracteres</span>
          <input type="file" id="fileInput" accept=".yaml,.yml" style="display:none">
          <button class="btn btn-ghost" id="uploadBtn" title="Subir archivo YAML">📤 Subir</button>
          <button class="btn btn-ghost" id="loadExample" title="Cargar ejemplo YAML">📂 Ejemplo</button>
          <span class="kbd-hint"><kbd>Ctrl</kbd>+<kbd>Enter</kbd></span>
          <button class="btn btn-primary" id="analyzeBtn">▶ Analizar</button>
        </div>
      </div>
      <div class="editor-wrapper lg lg-terminal drop-zone" id="editorWrapper">
        <div class="drop-overlay" id="dropOverlay">
          <div class="icon">📄</div>
          <h3>Suelta el archivo YAML aquí</h3>
          <p>.yaml o .yml — hasta 5 MB</p>
        </div>
        <div id="editorContainer"></div>
      </div>
    </div>

    <!-- Results Column -->
    <div class="panel results-panel">
      <div class="panel-header lg lg-terminal">
        <div class="panel-title">
          <span class="dot">▶</span>
          Resultados
        </div>
        <div class="panel-actions">
          <span class="file-info" id="resultCount">Esperando...</span>
        </div>
      </div>
      <div id="resultsContent" class="lg lg-terminal" style="flex:1; min-height: 320px;">
        <!-- Empty State -->
        <div class="state-empty" id="emptyState">
          <div class="icon">📄</div>
          <h3>Aún sin análisis</h3>
          <p>Escribe o pega una configuración YAML en el editor y haz clic en <strong style="color:var(--primary)">Analizar</strong> para comprobar errores.</p>
        </div>
        <!-- Loading State (Skeleton — "never spinners") -->
        <div class="state-loading" id="loadingState" style="display:none;">
          <div class="skeleton-group">
            <div class="skeleton skeleton-line"></div>
            <div class="skeleton skeleton-line"></div>
            <div class="skeleton skeleton-line"></div>
            <div class="skeleton skeleton-block"></div>
          </div>
          <div class="loading-label">
            <span>Analizando configuración</span>
            <span class="cursor-blink"></span>
          </div>
        </div>
        <!-- Results Content -->
        <div id="resultsInner" style="display:none;" class="results-content"></div>
      </div>
    </div>
  </div>

  <!-- ─── CodeMirror Initialization ─── -->
  <script type="module">
    // ── Individual package imports (each with ?external= to deduplicate shared deps) ──
    import { EditorView, keymap, lineNumbers, highlightActiveLineGutter, highlightSpecialChars, drawSelection, rectangularSelection, crosshairCursor, highlightActiveLine } from '@codemirror/view';
    import { EditorState } from '@codemirror/state';
    import { syntaxHighlighting, defaultHighlightStyle, indentOnInput, bracketMatching } from '@codemirror/language';
    import { defaultKeymap, history, historyKeymap, indentWithTab } from '@codemirror/commands';
    import { closeBrackets, closeBracketsKeymap, autocompletion, completionKeymap } from '@codemirror/autocomplete';
    import { highlightSelectionMatches, searchKeymap } from '@codemirror/search';
    import { yaml } from '@codemirror/lang-yaml';
    import { tags } from '@lezer/highlight';

    // ── Example YAML ──
    const EXAMPLE_YAML = `# Configuración de ejemplo
server:
  port: 8080
  host: localhost
  debug: false

database:
  host: db.example.com
  port: 5432
  name: myapp

logging:
  level: info`;

    // ── Custom Technical Mono Theme (replaces oneDark) ──
    const terminalTheme = EditorView.theme({
      '&': {
        backgroundColor: 'var(--bg)',
        color: 'var(--fg)',
      },
      '.cm-gutters': {
        backgroundColor: 'var(--bg)',
        borderRight: '1px solid oklch(100% 0 0 / 0.05)',
        color: 'var(--fg-dim)',
      },
      '.cm-activeLineGutter': {
        backgroundColor: 'var(--primary-dim)',
      },
      '.cm-activeLine': {
        backgroundColor: 'oklch(100% 0 0 / 0.025)',
      },
      '.cm-matchingBracket': {
        backgroundColor: 'oklch(65% 0.18 145 / 0.15)',
        outline: '1px solid oklch(65% 0.18 145 / 0.3)',
      },
      '.cm-selectionMatch': {
        backgroundColor: 'oklch(65% 0.18 145 / 0.1)',
      },
      '.cm-tooltip': {
        backgroundColor: 'var(--surface)',
        border: '1px solid var(--border)',
        color: 'var(--fg)',
      },
      '.cm-tooltip-autocomplete ul li[aria-selected]': {
        backgroundColor: 'var(--primary-dim)',
        color: 'var(--primary)',
      },
    });

    // ── Custom Technical Mono Syntax Highlighting ──
    const terminalHighlight = syntaxHighlighting([
      { tag: tags.comment, color: 'oklch(45% 0.01 260)', fontStyle: 'italic' },
      { tag: tags.string, color: 'oklch(72% 0.12 110)' },
      { tag: tags.number, color: 'oklch(72% 0.15 255)' },
      { tag: tags.bool, color: 'var(--primary)', fontWeight: 'bold' },
      { tag: tags.keyword, color: 'var(--primary)' },
      { tag: tags.null, color: 'var(--primary)' },
      { tag: tags.propertyName, color: 'oklch(85% 0.02 95)' },
      { tag: tags.punctuation, color: 'oklch(55% 0.01 260)' },
      { tag: tags.meta, color: 'oklch(62% 0.18 265)' },
      { tag: tags.literal, color: 'var(--fg)' },
      { tag: tags.content, color: 'var(--fg)' },
      { tag: tags.separator, color: 'var(--primary-dim)', fontWeight: 'bold' },
      { tag: tags.documentMeta, color: 'var(--fg-dim)' },
    ], { fallback: true });

    // ── Create Editor ──
    const container = document.getElementById('editorContainer');

    const startState = EditorState.create({
      doc: EXAMPLE_YAML,
      extensions: [
        lineNumbers(),
        highlightActiveLineGutter(),
        highlightSpecialChars(),
        history(),
        drawSelection(),
        EditorState.allowMultipleSelections.of(true),
        indentOnInput(),
        syntaxHighlighting(defaultHighlightStyle, { fallback: true }),
        bracketMatching(),
        closeBrackets(),
        autocompletion(),
        rectangularSelection(),
        crosshairCursor(),
        highlightActiveLine(),
        highlightSelectionMatches(),
        yaml(),
        terminalTheme,
        terminalHighlight,
        keymap.of([
          ...defaultKeymap,
          ...historyKeymap,
          ...completionKeymap,
          ...closeBracketsKeymap,
          ...searchKeymap,
          indentWithTab,
        ]),
        EditorView.updateListener.of((update) => {
          if (update.docChanged) {
            updateFileInfo(update.state.doc.length);
          }
        }),
      ],
    });

    const view = new EditorView({
      state: startState,
      parent: container,
    });

    const editorView = view;

    let currentFileName = null;

    function updateFileInfo(len) {
      const el = document.getElementById('fileInfo');
      if (currentFileName) {
        el.textContent = `${currentFileName} — ${len} caracteres`;
      } else {
        el.textContent = `${len} caracteres`;
      }
    }
    updateFileInfo(EXAMPLE_YAML.length);

    function setEditorContent(content, fileName) {
      currentFileName = fileName || null;
      editorView.dispatch({
        changes: {
          from: 0,
          to: editorView.state.doc.length,
          insert: content,
        },
      });
      updateFileInfo(content.length);
    }

    // ── Load Example Button ──
    document.getElementById('loadExample').addEventListener('click', () => {
      currentFileName = null;
      setEditorContent(EXAMPLE_YAML);
    });

    // ── File Upload ──
    const fileInput = document.getElementById('fileInput');
    document.getElementById('uploadBtn').addEventListener('click', () => {
      fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) {
        alert('Archivo demasiado grande. El tamaño máximo es 5 MB.');
        return;
      }
      const reader = new FileReader();
      reader.onload = (event) => {
        setEditorContent(event.target.result, file.name);
        // Auto-analyze after file upload
        analyzeBtn.click();
      };
      reader.readAsText(file);
      fileInput.value = ''; // Allow re-selecting the same file
    });

    // ── Drag-and-Drop ──
    const editorWrapper = document.getElementById('editorWrapper');
    const dropOverlay = document.getElementById('dropOverlay');
    let dragCounter = 0;

    editorWrapper.addEventListener('dragenter', (e) => {
      e.preventDefault();
      e.stopPropagation();
      dragCounter++;
      dropOverlay.classList.add('visible');
    });

    editorWrapper.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.stopPropagation();
    });

    editorWrapper.addEventListener('dragleave', (e) => {
      e.preventDefault();
      e.stopPropagation();
      dragCounter--;
      if (dragCounter === 0) {
        dropOverlay.classList.remove('visible');
      }
    });

    editorWrapper.addEventListener('drop', (e) => {
      e.preventDefault();
      e.stopPropagation();
      dragCounter = 0;
      dropOverlay.classList.remove('visible');

      const file = e.dataTransfer.files[0];
      if (!file) return;
      if (!file.name.endsWith('.yaml') && !file.name.endsWith('.yml')) {
        alert('Por favor, suelta un archivo .yaml o .yml.');
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        alert('Archivo demasiado grande. El tamaño máximo es 5 MB.');
        return;
      }
      const reader = new FileReader();
      reader.onload = (event) => {
        setEditorContent(event.target.result, file.name);
        // Auto-analyze after file drop
        analyzeBtn.click();
      };
      reader.readAsText(file);
    });

    // ── API Call ──
    const ORCHESTRATOR_URL = window.location.origin === 'http://localhost:5000'
      ? 'http://localhost:4000'
      : 'http://orchestrator:4000';

    async function analyzeYaml(content) {
      const response = await fetch(`${ORCHESTRATOR_URL}/analyze`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content }),
        signal: AbortSignal.timeout(30000),
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    // ── Renderizar resultados ──
    const STAGE_LABELS = {
      lexical: 'Léxico',
      syntactic: 'Sintáctico',
      semantic: 'Semántico',
    };

    function formatErrorCount(count, includeFound = true) {
      const label = count === 1 ? '1 error' : `${count} errores`;
      return includeFound
        ? (count === 1 ? '1 error encontrado' : `${count} errores encontrados`)
        : label;
    }

    function renderResults(data) {
      const emptyState = document.getElementById('emptyState');
      const loadingState = document.getElementById('loadingState');
      const resultsInner = document.getElementById('resultsInner');

      emptyState.style.display = 'none';
      loadingState.style.display = 'none';
      resultsInner.style.display = 'flex';
      resultsInner.innerHTML = '';

      // Summary
      const summary = document.createElement('div');
      summary.className = `result-summary ${data.valid ? 'valid' : 'invalid'}`;

      if (data.valid) {
        summary.innerHTML = `
          <span class="icon-lg">✅</span>
          <div class="info">
            <h4 style="color: var(--ok)">La configuración es válida</h4>
            <p>No se detectaron errores — el YAML pasó las tres etapas de análisis</p>
          </div>
        `;
      } else {
        const stageLabels = STAGE_LABELS;
        summary.innerHTML = `
          <span class="icon-lg">❌</span>
          <div class="info">
            <h4 style="color: var(--err)">${formatErrorCount(data.errors.length)}</h4>
            <p>El análisis se detuvo en la etapa <strong>${stageLabels[data.stage] || data.stage}</strong></p>
          </div>
        `;
      }
      resultsInner.appendChild(summary);

      document.getElementById('resultCount').textContent =
        data.valid ? '✓ Válido' : formatErrorCount(data.errors.length, false);

      if (!data.valid && data.errors.length > 0) {
        const errorList = document.createElement('div');
        errorList.className = 'error-list';

        data.errors.forEach((err, index) => {
          const card = document.createElement('div');
          card.className = 'error-card';
          card.setAttribute('data-stage', err.stage);
          card.style.animationDelay = `${0.08 + index * 0.06}s`;

          const stageLabel = STAGE_LABELS[err.stage] || err.stage.charAt(0).toUpperCase() + err.stage.slice(1);
          const location = `Línea ${err.line}${err.column ? `, Columna ${err.column}` : ''}`;

          const explanationHtml = err.explanation
            ? `<div class="error-explanation">${escapeHtml(formatExplanation(err.explanation))}</div>`
            : '';

          card.innerHTML = `
            <div class="card-header">
              <span class="stage-badge">${stageLabel}</span>
              <span class="error-code">${escapeHtml(err.code)}</span>
              <span class="error-location">${location}</span>
            </div>
            <div class="error-message">${escapeHtml(err.message)}</div>
            ${explanationHtml}
          `;
          errorList.appendChild(card);
        });

        resultsInner.appendChild(errorList);
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function formatExplanation(text) {
      return text.replace(/^\[(TECHNICAL|OFFLINE|ERROR)\]\s*/, '');
    }

    // ── Analyze Button ──
    const analyzeBtn = document.getElementById('analyzeBtn');
    const loadingState = document.getElementById('loadingState');

    // ── Retry helper for connection errors ──
    function showConnectionError(message) {
      const loadingState = document.getElementById('loadingState');
      const resultsInner = document.getElementById('resultsInner');
      const emptyState = document.getElementById('emptyState');

      loadingState.style.display = 'none';
      emptyState.style.display = 'none';
      resultsInner.style.display = 'flex';

      const container = document.createElement('div');
      container.className = 'result-summary invalid';
      container.innerHTML = `
        <span class="icon-lg">⚠️</span>
        <div class="info">
          <h4 style="color: var(--warn)">Error de conexión</h4>
          <p>${escapeHtml(message || 'No se pudo conectar con el servicio orquestador. Comprueba que todos los contenedores estén en ejecución.')}</p>
          <div class="connection-error" style="margin-top:0.75rem;">
            <button class="retry-btn" id="retryBtn">↻ Reintentar</button>
          </div>
        </div>
      `;
      resultsInner.innerHTML = '';
      resultsInner.appendChild(container);

      // Attach retry handler programmatically (no inline onclick)
      const retryBtn = resultsInner.querySelector('.retry-btn');
      if (retryBtn) {
        retryBtn.addEventListener('click', () => analyzeBtn.click());
      }

      document.getElementById('resultCount').textContent = 'Error';
    }

    analyzeBtn.addEventListener('click', async () => {
      const content = editorView.state.doc.toString();
      const emptyState = document.getElementById('emptyState');
      const resultsInner = document.getElementById('resultsInner');

      emptyState.style.display = 'none';
      resultsInner.style.display = 'none';
      loadingState.style.display = 'flex';
      analyzeBtn.disabled = true;
      analyzeBtn.innerHTML = '<span style="opacity:0.7">⏳</span> Analizando...';

      try {
        const data = await analyzeYaml(content);
        renderResults(data);
      } catch (err) {
        showConnectionError(err.message || 'La solicitud falló. ¿Está el orquestador en ejecución?');
      } finally {
        analyzeBtn.disabled = false;
        analyzeBtn.innerHTML = '▶ Analizar';
      }
    });

    // ── Keyboard shortcut: Ctrl+Enter ──
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        analyzeBtn.click();
      }
    });
  </script>
</body>
</html>
